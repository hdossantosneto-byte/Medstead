<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedStead</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f6f4ef;
        color: #0b2545;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        box-sizing: border-box;
        max-width: 28rem;
        margin: 0 auto;
        padding: 3rem 1.5rem 4rem;
        text-align: center;
      }
      img {
        width: min(100%, 16rem);
        height: auto;
      }
      h1 {
        margin: 1.5rem 0 0.35rem;
        font-size: 1.15rem;
        letter-spacing: 0.12em;
      }
      p {
        margin: 0.75rem 0 0;
        line-height: 1.5;
        color: #0b2545cc;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="medstead-logo.png" alt="MedStead Transport" />
      <h1>FASTER ACCESS. BETTER CARE.</h1>
      <p>
        This iOS shell loads the hosted MedStead company OS. Set
        <strong>CAPACITOR_SERVER_URL</strong> to the live HTTPS URL when it exists.
        App Store listing is in progress, not live.
      </p>
    </main>
  </body>
</html>
